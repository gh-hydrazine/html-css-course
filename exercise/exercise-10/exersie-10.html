<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exersie 10</title>
    <style>
        body {
            font-family: Arial;
        }
        p {
            margin: 0;
        }
        .card {
            border: solid 1px black;
            width: 200px;
            border-radius: 10px;
        }

        .profile-dp {
            width: 200px;
            border-radius: 10px 10px 0px 0px;;
        }

        .username {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .logo {
            width: 30px;
            vertical-align: middle;
        }

        .stat-text {
            display: inline-block;
            color: gray;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 20px;
            margin-bottom: 20px;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            background-color: rgb(226, 43, 43);
        }

        .username,
        .logo,
        .btn {
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="profile-container">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQcBnAGgtLo1LY_hibViO7gRygu_b5YFlneZw&s" alt="" class="profile-dp">
        </div>
        <div class="profile-info">
            <p class="username">Iron Man</p>

            <div class="stat">
                <img src="https://i.pinimg.com/736x/f4/f1/bc/f4f1bcd51f1e22f20762d0aabb4d7c86.jpg" alt="" class="logo">
                <p class="stat-text">Avenger Initiative</p>
            </div>

            <button class="btn">Add Friend</button>
        </div>
    </div>
</body>
</html>
