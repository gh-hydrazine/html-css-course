<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        .cat {
            width: 200px;
            height: 200px;
            object-position: center;
            border-radius: 100px;
        }

        .search--round {
            width: 250px;
            height: 30px;
            font-size: 20px;
            padding: 10px;
            border-radius: 10px;
            border: solid 1px grey;
            outline: none;
            margin-left: 50px;
        }

        .search--google {
            width: 400px;
            height: 40px;
            padding: 5px 20px;
            margin: 40px;;
            font-size: 18px;
            border: none;
            border-radius: 20px;
            box-shadow: 1px 2px 5px;
        }
        
        .email {
            font-size: 20px;
            margin: 5px 0%;


        }
        .signup--text {
            font-size: 14px
        }

        .input--email, .button--agree{
            width: 365px;
        }

        .input--email{
            height: 30px;
        }

        .button--agree{
            border-radius: 20px;
            border: none;
            background-color: rgb(70, 141, 223);
            color: white;
            font-weight: bold;
            font-size: 18px;
            padding: 5px;
            height: 50px;
        }

        .profile {
            width: 80px;
            height: 80px;
            border-radius: 40px;
            vertical-align: middle;
            margin-left: 50px;
        }

        .post--text, .tweet {
            font-size: 20px;
            width: 250px;
            padding: 10px;
            border: none;
            outline: none;
        }

        .tweet {
            width: 120px;
            border-radius: 50px;
            color: white;
            background-color: rgb(0, 119, 255);
            font-weight: bold;
        }
    </style>
    <title>Exersie 7</title>
</head>
<body>
    <img src="img/cat.jpg" alt="" class="cat">
    <input type="text" class="search--round" placeholder="Search">
    <input type="text" class="search--google" placeholder="Search with Google">
    <p class="email">Email</p>
    <input type="text" class="input--email">
    <p class="signup--text">By clicking 🚀 Agree & Join, you agree to the Privacy Policy.</p>
    <button type="submit" class="button--agree">Agree & Join</button>

    <img src="img/cat.jpg" alt="" class="profile">
    <input type="text" class="post--text" placeholder="What's happening?">
    <button class="tweet">Tweet</button>


</body>
</html>
