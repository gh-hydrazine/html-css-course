<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise *</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        .input-name,
        .input-email {
            width: 200px;
            height: 30px;
            padding: 5px;
            font-size: 14px;
            display: block;
            margin: 10px;
            border-radius: 5px;
            border: solid 1px grey;
        }

        .greet-text {
            width: 300px;
            font-size: 18px;
            display: inline-block
        ;   vertical-align: middle;
            margin: 50px  0px;
        }

        .btn-yes,
        .btn-no {
            width: 60px;
            height: 40px;
            font-size: 18px;
            margin-right: 5px;

        }

        .google {
            height: 100px;
            display: block;
            margin-left: 125px;
        }

        .search--google {
            width: 400px;
            height: 40px;
            padding: 5px 20px;
            font-size: 18px;
            border: none;
            border-radius: 20px;
            box-shadow: 1px 2px 5px;
            margin-left: 40px;
            display: block;
            margin-bottom:  50px;;;
        } 

        .input-firstname,
        .input-lastname,
        .input-email-form{
            width: 200px;
            height: 60px;
            font-size: 15px;
            border: solid 1px;
            border-radius: 6px;
            padding: 0px 10px;
        }

        .input-firstname{
            margin-right: 10px;;        
        }

        .input-email-form{
            display: block;
            width: 438px;
            margin-top: 12px
        }

        .btn-signup {
            width:460px;
            height: 60px;
            margin-top: 12px;
            background-color:rgb(75, 75, 230);
            color: white;
            font-size: 18px;
            border: none;            
            border-radius: 6px;
        }

        .text-uber{
            font-weight: bold;
            font-size: 30px;
            margin: 0;
            margin-top: 50px;
            margin-bottom: 10px;
        }
        
        .input-loc,
        .input-des {
            height: 40px;
            width: 350px;
            margin-bottom: 10px;
            padding: 5px;
            display: block;
            border: none;
            background-color: rgb(235, 235, 235);
        }
    
        .btn-req,
        .btn-reset {
            width: 150px;
            height: 50px;
            padding: 8px;
            border-radius: 0px;
            border: solid 1px;
        }
        
        .btn-req {
            color: white;
            background-color: black;
            margin-right: 10px;
        }

        .btn-reset {
            border: none;
        }

    </style>
</head>
<body>
    <input type="text" class="input-name" placeholder="Name">
    <input type="text" class="input-email" placeholder="Email">
    
    <p class="greet-text">Thanks for chatting with our customer support. Would you like to take our quick survey?</p>
    <button class="btn-yes">Yes</button>
    <button class="btn-no">No</button>

    <img src="img/google.png" alt="" class="google">
    <input type="text" class="search--google" placeholder="Search with Google">

    <input type="text" class="input-firstname" placeholder="First Name">
    <input type="text" class="input-lastname" placeholder="Last Name">
    <input type="text" class="input-email-form" " placeholder="Email">
    <button type="submit" class="btn-signup">Sign Up</button>

    <p class="text-uber" >Request a ride now</p>
    <input type="text" class="input-loc" placeholder="Emter pickup location">
    <input type="text" class="input-des" placeholder="Enter destination">
    <button type="submit" class="btn-req">Request now</button>
    <button type="reset" class="btn-reset">Clear</button>


</body> 
</html>
