<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="app.css">
    <title>YouTube</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

                <p class="video-title" >Talking Tech and AI with Google CEO Sundar Pichai!</p>

            <img class="thumbnail" src="https://supersimple.dev/exercises/youtube/thumbnails/thumbnail-2.webp" alt="">
        </div>
        
        <div>
            <div class="author">
                <img src="https://supersimple.dev/exercises/youtube/channel-profile-pics/channel-2.jpeg" alt="" class="author-dp">
            </div>

                <p class="video-title" >Try Not To Laugh Challenge #9 </p>
